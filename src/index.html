<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>AfriLove Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Console d'administration AfriLove World — modération, KYC, abonnements et analytics.">
  <meta name="theme-color" content="#faf8fd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#180f2a" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AfriLove Admin">
  <meta property="og:description" content="Console d'administration AfriLove World">
  <meta property="og:image" content="icon-512.png">
  <script>
    // Applique le thème avant le premier rendu pour éviter tout flash.
    (function () {
      try {
        var stored = localStorage.getItem('alw-admin-theme');
        var dark = stored ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* stockage indisponible : thème clair par défaut */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
